<!-- wp:group {"tagName":"main","layout":{"type":"constrained","contentSize":"760px"}} -->
<main class="wp-block-group">

	<!-- wp:html -->
	<div id="yp-wd-staging-review" class="yp-wd-portal yp-section">

		<p class="yp-eyebrow">Web Design</p>
		<h1>Review Your Staging Site</h1>

		<div class="yp-configurator__status" role="status" aria-live="polite">Loading&hellip;</div>

		<div data-yp-wd-content hidden>

			<div class="yp-wd-card">
				<p data-yp-wd-package></p>

				<div class="yp-wd-staging-link">
					<a class="wp-block-button__link is-style-outline" data-yp-wd-staging-url target="_blank" rel="noopener noreferrer">Open your staging site &rarr;</a>
				</div>

				<div data-yp-wd-already hidden>
					<p class="yp-field__hint" data-yp-wd-already-text></p>
				</div>

				<div data-yp-wd-actions>
					<div class="yp-proof-approval__actions">
						<button type="button" class="wp-block-button__link is-style-accent" data-yp-wd-approve>Approve — ready to go live</button>
						<button type="button" class="button-link" data-yp-wd-show-changes>Request changes instead</button>
					</div>

					<div class="yp-proof-approval__changes-form" data-yp-wd-changes-form hidden>
						<label for="yp-wd-changes-notes">What would you like changed?</label>
						<textarea id="yp-wd-changes-notes" rows="4" class="widefat"></textarea>
						<div class="yp-proof-approval__changes-actions">
							<button type="button" class="wp-block-button__link is-style-accent" data-yp-wd-submit-changes>Submit changes</button>
							<button type="button" class="button-link" data-yp-wd-cancel-changes>Cancel</button>
						</div>
					</div>
				</div>

				<p class="yp-configurator__cart-status" data-yp-wd-message hidden></p>
			</div>

		</div>

	</div>
	<!-- /wp:html -->

</main>
<!-- /wp:group -->
