<!-- wp:group {"tagName":"main","layout":{"type":"constrained","contentSize":"760px"}} -->
<main class="wp-block-group">

	<!-- wp:html -->
	<div id="yp-web-design-quote" class="yp-custom-order yp-section">

		<p class="yp-eyebrow">Web Design</p>
		<h1>Request a Quote</h1>
		<p>Tell us about your store and we'll put together a real proposal — package, timeline, and hosting all included in the reply.</p>

		<form id="yp-web-design-quote-form">

			<div class="yp-field">
				<label for="yp-wdq-business">Business / brand name</label>
				<input type="text" id="yp-wdq-business" name="business_name" maxlength="120" required class="widefat" />
			</div>

			<div class="yp-field">
				<label for="yp-wdq-name">Your name</label>
				<input type="text" id="yp-wdq-name" name="name" maxlength="120" autocomplete="name" required class="widefat" />
			</div>

			<div class="yp-field">
				<label for="yp-wdq-email">Email</label>
				<input type="email" id="yp-wdq-email" name="email" autocomplete="email" required class="widefat" />
			</div>

			<div class="yp-field">
				<label for="yp-wdq-phone">Phone <span class="description">(optional)</span></label>
				<input type="tel" id="yp-wdq-phone" name="phone" autocomplete="tel" class="widefat" />
			</div>

			<div class="yp-field">
				<label for="yp-wdq-sell">Briefly, what are you selling?</label>
				<input type="text" id="yp-wdq-sell" name="what_you_sell" maxlength="200" required class="widefat" />
			</div>

			<div class="yp-field" role="radiogroup" aria-label="Do you already have a website?">
				<label>Do you already have a website?</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_website" value="yes" data-yp-wdq-has-website />
					<span>Yes</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_website" value="no" data-yp-wdq-has-website checked />
					<span>No</span>
				</label>
			</div>

			<div class="yp-field" data-yp-wdq-website-url-field hidden>
				<label for="yp-wdq-website-url">Current website URL</label>
				<input type="url" id="yp-wdq-website-url" name="website_url" class="widefat" />
			</div>

			<div class="yp-field">
				<label for="yp-wdq-product-count">Roughly how many products will you carry?</label>
				<select id="yp-wdq-product-count" name="product_count" class="widefat">
					<option value="">Choose one&hellip;</option>
					<option value="1_10">1–10</option>
					<option value="11_50">11–50</option>
					<option value="51_200">51–200</option>
					<option value="200_up">200+</option>
				</select>
			</div>

			<div class="yp-field">
				<label for="yp-wdq-package">Which package are you interested in?</label>
				<select id="yp-wdq-package" name="package" required class="widefat">
					<option value="">Loading&hellip;</option>
				</select>
			</div>

			<div class="yp-field">
				<label for="yp-wdq-timeline">When are you hoping to launch?</label>
				<select id="yp-wdq-timeline" name="timeline" class="widefat">
					<option value="">Choose one&hellip;</option>
					<option value="asap">ASAP</option>
					<option value="one_month">Within a month</option>
					<option value="one_to_three">1–3 months</option>
					<option value="exploring">Just exploring</option>
				</select>
			</div>

			<div class="yp-field" role="radiogroup" aria-label="Do you already have web hosting?">
				<label>Do you already have web hosting?</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_hosting" value="yes" />
					<span>Yes</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_hosting" value="no" />
					<span>No</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_hosting" value="unsure" checked />
					<span>Not sure</span>
				</label>
			</div>

			<div class="yp-field" role="radiogroup" aria-label="Do you already own a domain name?">
				<label>Do you already own a domain name?</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_domain" value="yes" data-yp-wdq-has-domain />
					<span>Yes</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="has_domain" value="no" data-yp-wdq-has-domain checked />
					<span>No</span>
				</label>
			</div>

			<div class="yp-field" data-yp-wdq-domain-name-field hidden>
				<label for="yp-wdq-domain-name">Domain name</label>
				<input type="text" id="yp-wdq-domain-name" name="domain_name" placeholder="yourstore.com" class="widefat" />
			</div>

			<div class="yp-field" role="radiogroup" aria-label="Interested in our hosting add-on? $35 per month, includes email and a one-year domain registration.">
				<label>Interested in our hosting add-on? <span class="description">($35/mo — includes email &amp; a 1-year domain)</span></label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_hosting_addon" value="yes" />
					<span>Yes</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_hosting_addon" value="no" checked />
					<span>No</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_hosting_addon" value="tell_me_more" />
					<span>Tell me more</span>
				</label>
			</div>

			<div class="yp-field" role="radiogroup" aria-label="Interested in ongoing maintenance and monitoring after launch?">
				<label>Interested in ongoing maintenance &amp; monitoring after launch?</label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_maintenance" value="yes" />
					<span>Yes</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_maintenance" value="no" />
					<span>No</span>
				</label>
				<label class="yp-radio-option">
					<input type="radio" name="wants_maintenance" value="unsure" checked />
					<span>Not sure</span>
				</label>
			</div>

			<div class="yp-field">
				<label for="yp-wdq-details">Anything else we should know? <span class="description">(optional — must-have features, sites you like, budget range, etc.)</span></label>
				<textarea id="yp-wdq-details" name="details" rows="4" maxlength="2000" class="widefat"></textarea>
			</div>

			<!-- Honeypot — left visually hidden for real visitors (not type="hidden"; see class-web-design-quote-controller.php) and never filled in by one. -->
			<div class="yp-field yp-field--honeypot" aria-hidden="true">
				<label for="yp-wdq-website">Website</label>
				<input type="text" id="yp-wdq-website" name="website" tabindex="-1" autocomplete="off" />
			</div>

			<p>
				<button type="submit" class="wp-block-button__link is-style-accent" data-yp-wdq-submit>Request a Quote</button>
			</p>

		</form>

	</div>
	<!-- /wp:html -->

</main>
<!-- /wp:group -->

<!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
