<div id="yp-search-drawer" class="yp-drawer yp-drawer--top" aria-hidden="true">
	<div class="yp-drawer__backdrop"></div>
	<div class="yp-drawer__panel" role="dialog" aria-modal="true" aria-label="Search">
		<div class="yp-drawer__header">
			<span>Search</span>
			<button type="button" class="yp-icon-button" data-yp-drawer-close aria-label="Close search">
				<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
					<line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
					<line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
				</svg>
			</button>
		</div>
		<div class="yp-drawer__body">
			<form role="search" method="get" class="yp-search-form" action="/">
				<label class="screen-reader-text" for="yp-search-input">Search designs, styles, materials</label>
				<input type="search" id="yp-search-input" name="s" placeholder="Search designs, styles, materials&hellip;" autocomplete="off" />
			</form>
			<div id="yp-search-results" class="yp-search-results" aria-live="polite"></div>
		</div>
	</div>
</div>
<!-- /wp:html -->
