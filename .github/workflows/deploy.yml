name: Deploy to production

# Fires the moment Prod moves. `script:` below is what actually runs —
# the originally-planned forced-command restriction in authorized_keys
# (pinning the key to only ever run this one script server-side) turned
# out not to survive on this instance: its guest agent periodically
# rewrites ~/.ssh/authorized_keys from instance SSH-key metadata, wiping
# any manually-added line including the forced-command one. The deploy
# key here is instead added through that same metadata mechanism (see
# docs/deploy-setup.md), which the guest agent preserves — but that
# mechanism doesn't support the command= restriction, so this key can
# run anything the deploy user could; treat it with the same care as
# any other credential with real access to that account.
on:
  push:
    branches: [Prod]

# Test marker — confirms this workflow actually fires end-to-end on a
# real push to Prod. Safe to remove once verified.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run the deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: /var/www/html/yeffoprint-deploy/deploy/pull-and-deploy.sh
