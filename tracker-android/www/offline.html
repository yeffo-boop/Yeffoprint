<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>YeffoHealth</title>
	<style>
		:root { color-scheme: light; }
		body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF9F6; color: #1A1A1A; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
		main { padding: 32px 24px; max-width: 360px; }
		img { width: 72px; height: 72px; border-radius: 18px; }
		h1 { font-size: 22px; margin: 16px 0 8px; }
		p { margin: 0 0 20px; color: #5C5C5C; }
		button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 28px; background: #1A1A1A; color: #fff; }
	</style>
</head>
<body>
	<main>
		<img src="icon.png" alt="">
		<h1>You’re offline</h1>
		<p>YeffoHealth needs a connection the first time it opens. After that it keeps a copy on your phone.</p>
		<button type="button" onclick="location.href='https://yeffodesign.com/tracker/'">Try again</button>
	</main>
</body>
</html>
